# Netlify reads this automatically — no dashboard setup needed beyond
# connecting the repo. See README.md for the click-by-click steps.
[build]
  command = "npm run build"
  publish = "dist"

# SAFE ROAD to Supabase (fix for "Failed to fetch").
# The app calls  /sb/rest/v1/rpc/...  on its own site; Netlify's server forwards it to Supabase.
# The phone never has to reach *.supabase.co itself, and there is no cross-site (CORS) step.
# MUST match SB_URL in src/config.js. If you move to a new Supabase project, change BOTH.
[[redirects]]
  from = "/sb/*"
  to = "https://xdjfiiuqiecntyuarvkq.supabase.co/:splat"
  status = 200
  force = true

# The page itself must never be kept stale by the browser (the service worker already asks the network first).
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
